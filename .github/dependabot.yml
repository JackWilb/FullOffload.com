version: 2
updates:
  # The pnpm workspace (root and web/) uses the npm ecosystem.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # @types/node follows the Node LTS pinned in .nvmrc; bump both together.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
      # typescript-eslint supports TypeScript < 6.1. Revisit when it supports 7.
      - dependency-name: typescript
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
