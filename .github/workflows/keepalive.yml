name: Keepalive

# Free-tier Supabase projects pause after a week without activity. A real read query twice a week
# keeps the project awake. GitHub emails when this fails or before it disables scheduled runs.
on:
  schedule:
    - cron: "17 9 * * 2,5" # Tuesdays and Fridays, 09:17 UTC
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query the production API
        env:
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::notice title=Keepalive skipped::Add the VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY repository variables (README, Production setup)."
            exit 0
          fi
          curl --fail-with-body --silent --show-error \
            -H "apikey: $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/devices?select=id&limit=1"
          echo
