name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Start local Supabase
        # Only the services the app and tests use.
        run: pnpm supabase start -x studio,mailpit,imgproxy,logflare,vector,supavisor

      - name: Reset database (migrations + seed)
        run: pnpm db:reset

      - name: SQL and RLS tests
        run: pnpm test:db

      - name: Generated types are up to date
        run: |
          pnpm db:types
          git diff --exit-code -- web/src/lib/database.types.ts || {
            echo "::error::web/src/lib/database.types.ts is stale. Run pnpm db:types and commit it."
            exit 1
          }

      - name: Build
        run: pnpm build
