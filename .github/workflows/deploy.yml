name: Deploy

# Runs after CI passes on a push to main: migrate the prod database, then publish the site to
# GitHub Pages. Each part skips itself, with a notice, until its secrets or variables exist.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  config:
    name: Check configuration
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      database: ${{ steps.check.outputs.database }}
      pages: ${{ steps.check.outputs.pages }}
    steps:
      - id: check
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -n "$SUPABASE_DB_URL" ]; then
            echo "database=true" >> "$GITHUB_OUTPUT"
          else
            echo "database=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Database deploy skipped::Add the SUPABASE_DB_URL repository secret (the session pooler connection string) to deploy migrations (README, Production setup)."
          fi
          if [ -n "$VITE_SUPABASE_URL" ] && [ -n "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "pages=true" >> "$GITHUB_OUTPUT"
          else
            echo "pages=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Site deploy skipped::Add the VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY repository variables to deploy the site (README, Production setup)."
          fi

  database:
    name: Migrate database
    needs: config
    if: needs.config.outputs.database == 'true'
    runs-on: ubuntu-latest
    env:
      # The session pooler connection string, password included. It connects straight to
      # Postgres, so there is no expiring access token to rotate.
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Apply new migrations
        run: pnpm supabase db push --db-url "$SUPABASE_DB_URL" --yes

      - name: Upsert curated devices
        # seed.sql is idempotent (upserts on normalized_name), so it runs on every deploy and
        # spec fixes in it reach prod.
        run: psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 --quiet --file supabase/seed.sql

  pages:
    name: Deploy site
    needs: [config, database]
    # Deploy even when the database job was skipped for missing secrets, but never after it failed.
    if: >-
      always() && needs.config.outputs.pages == 'true' &&
      (needs.database.result == 'success' || needs.database.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: pnpm build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

      - id: deployment
        uses: actions/deploy-pages@v5
